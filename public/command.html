<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Befehl senden</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>ESP32 Befehl senden</h2>

    <input id="cmd" type="text" placeholder="Befehl eingeben">
    <button onclick="sendCommand()">Senden</button>

    <p id="status"></p>

    <script>
        function sendCommand() {
            const command = document.getElementById("cmd").value;

            fetch("/api/setCommand", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: command })
            })
            .then(res => res.text())
            .then(text => {
                document.getElementById("status").innerText = "Server Antwort: " + text;
            })
            .catch(err => {
                document.getElementById("status").innerText = "Fehler: " + err;
            });
        }
    </script>

</body>
</html>
